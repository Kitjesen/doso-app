<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DOSO · 登顶之后</title>
  <link rel="stylesheet" href="concepts.css">
  <link rel="stylesheet" href="summit.css">
  <link rel="stylesheet" href="summit-motion.css">
</head>
<body data-theme="summit">
  <!-- Existing DOSO wordmark, MiSans and account fields; material studies only. -->
  <main class="screen" data-screen-label="登录视觉探索">
    <div class="art summit" aria-hidden="true">
      <picture>
        <source media="(min-width:700px) and (orientation:landscape)" srcset="assets/summit-landscape.png">
        <img src="assets/summit-dawn.png" alt="">
      </picture>
      <div class="summit-mist"></div>
      <div class="summit-light"></div>
    </div>
    <div class="foreground">
      <header class="brand"><img src="assets/doso.png" alt="DOSO robotics"><h1>与你一起，向前探索。</h1></header>
      <section class="account" aria-label="账户登录">
      <form class="glass" novalidate>
        <label for="email">邮箱</label>
        <div class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
          <input id="email" type="email" placeholder="输入邮箱地址" autocomplete="off" spellcheck="false" required>
        </div>
        <div class="password-heading">
          <label for="password">密码</label>
          <button class="forgot" type="button">忘记密码？</button>
        </div>
        <div class="field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V6a4 4 0 0 1 8 0v4"></path></svg>
          <input id="password" type="password" placeholder="输入密码" autocomplete="off" required>
          <button class="eye" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-6 10-6 10 6 10 6-3 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </div>
        <button class="submit" type="submit">登录</button>
      </form>
      <div class="register"><span>还没有账户？</span><button type="button">注册</button></div>
      <p class="notice" role="status"></p>
      </section>
    </div>
    <button class="motion" type="button" aria-pressed="false" aria-label="暂停背景动效"><span></span><span></span></button>
  </main>
  <script>
    const password=document.getElementById('password');
    document.querySelector('.eye').addEventListener('click',event=>{
      const visible=password.type==='password';password.type=visible?'text':'password';
      event.currentTarget.setAttribute('aria-label',visible?'隐藏密码':'显示密码');
      event.currentTarget.setAttribute('aria-pressed',String(visible));
    });
    const inform=()=>{document.querySelector('.notice').textContent='视觉预览，未发送任何账号信息。';};
    document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();if(event.target.reportValidity())inform();});
    document.querySelector('.forgot').addEventListener('click',inform);
    document.querySelector('.register button').addEventListener('click',inform);
  </script>
  <script src="summit-motion.js"></script>
</body>
</html>
