// An independently installed, receive-only native video acceptance build.
android {
    buildTypes {
        videotest {
            initWith release
            applicationIdSuffix ".videotest"
            versionNameSuffix "-videotest"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
        }
    }
}

afterEvaluate {
    tasks.named('createBundleVideotestJsAndAssets').configure { bundleTask ->
        bundleTask.entryFile.set(file('../../index.video-test.ts'))
    }
}
