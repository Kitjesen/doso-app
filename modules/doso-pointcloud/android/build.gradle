plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.dosopointcloud'
version = '1.0.0'

def rustLibraries = layout.buildDirectory.dir('rust/jniLibs')
android {
  namespace 'expo.modules.dosopointcloud'
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
  sourceSets.main.jniLibs.srcDir(rustLibraries)
}

def sdkRoot = providers.environmentVariable('DOSO_SDK_ROOT')
  .orElse(providers.gradleProperty('dosoSdkRoot'))
tasks.register('buildRustPointCloud', Exec) {
  if (sdkRoot.isPresent()) {
    inputs.dir(new File(sdkRoot.get(), 'src'))
    inputs.dir(new File(sdkRoot.get(), 'proto'))
    inputs.dir(new File(sdkRoot.get(), 'android/src'))
    inputs.file(new File(sdkRoot.get(), 'Cargo.toml'))
    inputs.file(new File(sdkRoot.get(), 'Cargo.lock'))
    inputs.file(new File(sdkRoot.get(), 'build.rs'))
    inputs.file(new File(sdkRoot.get(), 'docs/usage.md'))
    inputs.file(new File(sdkRoot.get(), 'android/Cargo.toml'))
    inputs.file(new File(sdkRoot.get(), 'android/Cargo.lock'))
    inputs.file(new File(sdkRoot.get(), 'android/build.ps1'))
    inputs.file(new File(sdkRoot.get(), 'android/build.sh'))
  }
  outputs.dir(rustLibraries)
  outputs.upToDateWhen { sdkRoot.isPresent() }
  doFirst {
    if (!sdkRoot.isPresent()) throw new GradleException('Set DOSO_SDK_ROOT or -PdosoSdkRoot to the DOSO-SDK checkout.')
    def windows = System.getProperty('os.name').toLowerCase().contains('windows')
    def script = new File(sdkRoot.get(), windows ? 'android/build.ps1' : 'android/build.sh')
    if (!script.isFile()) throw new GradleException("Missing Rust Android build script: ${script}")
    def ndk = new File(android.sdkDirectory, "ndk/${android.ndkVersion}")
    if (windows) {
      commandLine('powershell.exe', '-NoProfile', '-File', script.absolutePath, '-NdkRoot', ndk.absolutePath,
        '-OutputDir', rustLibraries.get().asFile.absolutePath, '-Abi', 'arm64-v8a')
    } else {
      commandLine('bash', script.absolutePath, '--ndk-root', ndk.absolutePath,
        '--output-dir', rustLibraries.get().asFile.absolutePath, '--abi', 'arm64-v8a')
    }
  }
}
tasks.named('preBuild').configure { dependsOn('buildRustPointCloud') }
