log_format doso_api_status escape=json '{"method":"$request_method","status":"$status","upstream_status":"$upstream_status","request_time":"$request_time"}';

server {
    listen 443 ssl;
    server_name api-test.dosorobotics.com;

    ssl_certificate /etc/letsencrypt/live/api-test.dosorobotics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-test.dosorobotics.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/doso-api-access.log doso_api_status;
    # Keep Auth codes and request URLs out of error logs, as in the existing template.
    error_log /dev/null;

    location ~ ^/(?:auth/v1/|rest/v1/|functions/v1/(?:account-sessions|device-binding|remote-state|remote-state-sync|admin-devices|video-access|video-authorize|remote-history|telemetry-export)$) {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Sb-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
