# Dedicated API hostname; retain the existing inovxio.com server block.
server {
    listen 80;
    server_name api-test.dosorobotics.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/doso-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://api-test.dosorobotics.com$request_uri;
    }
}
