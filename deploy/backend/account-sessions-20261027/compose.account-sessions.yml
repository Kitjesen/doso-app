# Append after the active nine Shanghai layers. Only api-gw and functions may change.
services:
  api-gw:
    volumes: !override
      - type: bind
        source: ./doso/gateway-loopback-20261027/envoy.yaml
        target: /etc/envoy/envoy.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./doso/account-sessions-20261027/cds.yaml
        target: /etc/envoy/cds.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./doso/account-sessions-20261027/lds.template.yaml
        target: /etc/envoy/lds.template.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./doso/gateway-loopback-20261027/validate-config.mjs
        target: /app/validate-config.mjs
        read_only: true
        bind: {create_host_path: false}

  functions:
    image: public.ecr.aws/supabase/edge-runtime@sha256:fded42ff725708990b1a0803633c2659453259d075c4bec6b4d01dfb82dc055e
    pull_policy: never
    depends_on: !override
      api-gw:
        condition: service_healthy
    environment: !override
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?Use the existing approved test origin}
      SUPABASE_ANON_KEY: ${ANON_KEY:?Use the existing new test public key}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Use the existing server-only test key}
      VERIFY_JWT: "false"
      DOSO_ALLOWED_WEB_ORIGINS: ${DOSO_ALLOWED_WEB_ORIGINS:-}
      DENO_DIR: /root/.cache/deno
    volumes: !override
      - type: bind
        source: ./doso/account-sessions-20261027/functions
        target: /home/deno/functions
        read_only: true
        bind: {create_host_path: false}
      - type: volume
        source: deno-cache
        target: /root/.cache/deno
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      core: {soft: 0, hard: 0}
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16777216,mode=0700
    logging:
      driver: none
